# Slimeville on the Oracle box (deploy/oracle/README.md): nginx on :443 behind Cloudflare's proxy (no tunnel).
# Cloudflare connects with SSL "Full (strict)" and trusts the Cloudflare Origin Certificate below; firewalld only
# lets Cloudflare's IP ranges reach 443 (deploy/oracle/cloudflare-firewall.sh).
# Install: sudo install -m 644 deploy/oracle/nginx-rpg.conf /etc/nginx/conf.d/rpg.conf && sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpg.tylergoh.com;

    # Cloudflare Origin Certificate (dashboard → SSL/TLS → Origin Server). Secrets: never commit these.
    ssl_certificate     /etc/nginx/ssl/rpg-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/rpg-origin.key;

    location = / {
        return 302 /rpg/;
    }

    # The game: user unit rpg.service on 127.0.0.1:3002, WebSocket at /rpg/ws.
    location = /rpg {
        return 301 /rpg/;
    }

    location /rpg/ {
        proxy_pass http://127.0.0.1:3002;   # no trailing slash: keeps /rpg/, matching Vite's base
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;              # long-lived game sockets
        proxy_send_timeout 1h;
    }

    # The dev sandbox (docs/sandbox.md): rpg-dev.socket / rpg-dev.service on 127.0.0.1:3003, started on demand
    # (the first request may wait while it builds), WebSocket at /rpg_dev/ws.
    location = /rpg_dev {
        return 301 /rpg_dev/;
    }

    location /rpg_dev/ {
        proxy_pass http://127.0.0.1:3003;   # no trailing slash: keeps /rpg_dev/, matching its RPG_BASE
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;              # long-lived game sockets (and a cold start's build)
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
