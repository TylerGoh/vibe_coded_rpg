# Needed for the frontend's live-update websocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80;
    server_name example.com;

    # Placeholder root page
    location = / {
        default_type text/html;
        return 200 '<h1>Hello world</h1>';
    }

    # Beep timer app (Flask service on 127.0.0.1:8090)
    location = /timer {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    location = /timer/ {
        return 301 /timer;
    }

    # Slime Hop game (user service game.service on 127.0.0.1:3000)
    location = /game {
        return 301 /game/;
    }

    location /game/ {
        proxy_pass http://127.0.0.1:3000;   # no trailing slash: keeps /game/, matching Vite's base
        proxy_set_header Host $host;
    }

    # Slimeville multiplayer village (user service rpg.service on 127.0.0.1:3002).
    # /rpg/ws is its WebSocket, so this location passes the upgrade through.
    location = /rpg {
        return 301 /rpg/;
    }

    location /rpg/ {
        proxy_pass http://127.0.0.1:3002;   # no trailing slash: keeps /rpg/, matching Vite's base
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;              # long-lived game sockets
        proxy_send_timeout 1h;
    }

    # Slimeville's dev sandbox (docs/sandbox.md in ~/rpg): user units rpg-dev.socket / rpg-dev.service on 127.0.0.1:3003,
    # started on demand by the socket (the first request may wait while it builds), WebSocket at /rpg_dev/ws.
    location = /rpg_dev {
        return 301 /rpg_dev/;
    }

    location /rpg_dev/ {
        proxy_pass http://127.0.0.1:3003;   # no trailing slash: keeps /rpg_dev/, matching its RPG_BASE
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;              # long-lived game sockets (and a cold start's build)
        proxy_send_timeout 1h;
    }

    # Calendar viewer + task outcome API (user service calendar.service on 127.0.0.1:8091).
    # Basic auth with the owntracks viewer login (same realm, so the browser reuses it).
    location = /cal {
        return 301 /cal/;
    }

    location /cal/ {
        auth_basic           "OwnTracks viewer";
        auth_basic_user_file /etc/nginx/.owntracks_view_htpasswd;

        proxy_pass http://127.0.0.1:8091;   # no trailing slash: keeps /cal/, matching the Flask prefix
        proxy_set_header Host $host;
    }

    # Bank view + cycle planner (user service wise-bank-web.service on 127.0.0.1:8092).
    # Basic auth with the owntracks viewer login (same realm, so the browser reuses it).
    location = /bank {
        return 301 /bank/;
    }

    location /bank/ {
        auth_basic           "OwnTracks viewer";
        auth_basic_user_file /etc/nginx/.owntracks_view_htpasswd;
        limit_except GET POST { deny all; }   # POST = planner forms (app checks same-origin)

        proxy_pass http://127.0.0.1:8092;   # no trailing slash: keeps /bank/, matching the Flask prefix
        proxy_set_header Host $host;
    }

    # Frontend at /track/ (basic auth)
    location = /track {
        return 301 /track/;
    }

    location /track/ {
        auth_basic           "OwnTracks viewer";
        auth_basic_user_file /etc/nginx/.owntracks_view_htpasswd;

        proxy_pass http://127.0.0.1:8080/;   # trailing slash strips /track/
        proxy_set_header Host $host;
    }

    # Backend: phone uploads (basic auth, POST only)
    location = /api/track/pub {
        auth_basic           "OwnTracks";
        auth_basic_user_file /etc/nginx/.owntracks_htpasswd;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:8083/pub;
        proxy_set_header Host $host;
    }

    # Backend: read API + websocket for the frontend (basic auth, GET only).
    # Same realm/file as /track/ so the browser reuses the credentials it already has.
    location /api/track/ {
        auth_basic           "OwnTracks viewer";
        auth_basic_user_file /etc/nginx/.owntracks_view_htpasswd;
        limit_except GET { deny all; }

        proxy_pass http://127.0.0.1:8083/;   # strips /api/track/
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
